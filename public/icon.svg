<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-base" x1="96" y1="32" x2="416" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c3d35"/>
      <stop offset="0.42" stop-color="#145c4f"/>
      <stop offset="1" stop-color="#2a9d86"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(168 128) rotate(52) scale(220 180)">
      <stop stop-color="#5fd4bc" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#2a9d86" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#145c4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 280) rotate(90) scale(300 260)">
      <stop stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#041612" stop-opacity="0.42"/>
    </radialGradient>
    <linearGradient id="mark-body" x1="176" y1="148" x2="336" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e8f7f2"/>
      <stop offset="1" stop-color="#b8e8dc"/>
    </linearGradient>
    <linearGradient id="mark-edge" x1="200" y1="160" x2="312" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rim" x1="128" y1="64" x2="384" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#021410" flood-opacity="0.35"/>
    </filter>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-base)"/>
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)"/>
  <rect width="512" height="512" rx="112" fill="url(#bg-vignette)"/>

  <!-- rim light -->
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- abstract purity mark: interlocking lens + horizon -->
  <g filter="url(#soft-shadow)">
    <!-- outer lens arc -->
    <path
      d="M256 132
         C318 132 372 176 372 248
         C372 320 318 364 256 364
         C194 364 140 320 140 248
         C140 176 194 132 256 132Z
         M256 168
         C214 168 180 202 180 248
         C180 294 214 328 256 328
         C298 328 332 294 332 248
         C332 202 298 168 256 168Z"
      fill="url(#mark-body)"
      fill-rule="evenodd"
      opacity="0.96"
    />

    <!-- horizon beam -->
    <path
      d="M168 252 H344"
      stroke="url(#mark-edge)"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.72"
    />

    <!-- ascending clarity line -->
    <path
      d="M256 196 V304"
      stroke="url(#mark-edge)"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.38"
    />

    <!-- focal point -->
    <circle cx="256" cy="252" r="11" fill="#ffffff" filter="url(#inner-glow)"/>
    <circle cx="256" cy="252" r="5" fill="#2a9d86"/>
  </g>
</svg>
