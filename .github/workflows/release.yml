# GitHub Releases 自动更新发布
#
# 触发：推送版本 tag，例如 git tag v0.1.1 && git push origin v0.1.1
#
# 首次使用前在 GitHub 仓库 Settings → Secrets → Actions 添加：
#   TAURI_SIGNING_PRIVATE_KEY
#     内容为本机 src-tauri/.tauri/updater.key 文件全文（单行 base64）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     若生成密钥时未设密码，留空或填任意占位（workflow 中可为 ""）
#
# 仓库需先创建 GitHub 镜像：github.com/yuteng77/pure-clean
# 若路径不同，请同步修改 tauri.conf.json 中的 updater.endpoints

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "净界 ${{ github.ref_name }}"
          releaseBody: |
            ## 净界 ${{ github.ref_name }}

            - 下载 **`*-setup.exe`**（NSIS 安装包）进行全新安装
            - 已安装旧版本的用户可通过应用内「设置 → 检查更新」自动升级

            `latest.json` 已随 Release 上传，供应用内 updater 使用。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
